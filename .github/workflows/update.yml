name: Update thumbnail gallery

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, at :17
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update gallery
        env:
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          # SKIP_SHORTS: "1"   # uncomment to ignore Shorts
        run: |
          # On Sundays (UTC) also drop videos that have been deleted.
          ARGS=""
          if [ "$(date -u +%u)" = "7" ]; then ARGS="$ARGS --prune"; fi
          # A manual run also rebuilds the page, so template changes show up.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --force"; fi
          python update_gallery.py $ARGS

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ids.txt titles.json docs/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update thumbnail gallery"
            git push
          fi
